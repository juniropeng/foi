name: Auto Update M3U Playlist

on:
  schedule:
    # cron 表达式：每 4 小时运行一次 (第 0 分钟执行)
    - cron: '0 */4 * * *'
  workflow_dispatch: # 允许在 GitHub 页面手动点击按钮触发运行

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. 检出仓库代码
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. 设置 Python 环境
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    # 3. 安装依赖库
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    # 4. 执行 test.py 脚本
    - name: Run script
      run: python test.py

    # 5. 检查变动并提交新生成的 M3U 文件回仓库
    - name: Commit and Push changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add live_playlist.m3u
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update live_playlist.m3u" && git push)
